<!-- dashboard (dark theme): KPIs · Distribution (bars) · Detail table (sortable) · Notes. Aggregate first; the artifact shows the shape, not the dump. -->
<section id="kpis">
  <h2>{{Metric}} — at a glance</h2>
  <script type="application/json" data-component="kpis">
  [{"label":"p50","value":"{{v}}","tone":"ok"},{"label":"p75","value":"{{v}}","tone":"warn"},{"label":"p95","value":"{{v}}","tone":"risk"},{"label":"runs","value":"{{n}}","sub":"{{window}}"}]
  </script>
</section>

<section id="distribution">
  <h2>Distribution</h2>
  <script type="application/json" data-component="bars">
  {"unit":"{{s}}","items":[{"label":"{{bucket}}","value":12,"tone":"ok"},{"label":"{{bucket}}","value":30,"tone":"warn"},{"label":"{{bucket}}","value":5,"tone":"risk"}]}
  </script>
</section>

<section id="detail">
  <h2>Detail</h2>
  <table class="data" data-sortable><thead><tr><th>Run</th><th class="num">Duration</th><th>Status</th><th>Link</th></tr></thead>
  <tbody><tr><td>{{id}}</td><td class="num">{{12.3}}</td><td><span class="chip ok">ok</span></td><td><a href="{{url}}">open</a></td></tr></tbody></table>
</section>

<section id="notes">
  <h2>Notes</h2>
  <aside class="callout note">{{Method, window, caveats}}</aside>
</section>
